# NATS Server Configuration
server_name: nats-shortlink
listen: 0.0.0.0:4222
http_port: 8222

# Logging
debug: false
trace: false
logtime: true
log_file: "/tmp/nats-server.log"

# Limits
max_connections: 64K
max_control_line: 4KB
max_payload: 1MB
max_pending: 64MB
max_subscriptions: 0

# Authentication (optional, disabled for local development)
# authorization {
#   user: nats
#   password: password
# }

# JetStream Configuration
jetstream {
    # Storage directory for JetStream
    store_dir: "/data/jetstream"

    # Memory and file storage limits
    max_memory_store: 1GB
    max_file_store: 10GB

    # Domain configuration (optional)
    # domain: "shortlink"
}

# Stream Configuration for JetStream
# Note: Streams are created programmatically or via NATS CLI, not in server config
# The shortlink_events and DLQ streams should be created by the application on startup

# Clustering (for production with multiple NATS servers)
# cluster {
#   name: shortlink-cluster
#   listen: 0.0.0.0:6222
#   routes = [
#     nats://nats1:6222
#     nats://nats2:6222
#   ]
# }

# Monitoring
monitor_port: 8222

# Performance optimizations
write_deadline: "2s"
ping_interval: "2m"
ping_max: 2

# TLS Configuration (for production)
# tls {
#   cert_file: "/etc/nats/certs/server.crt"
#   key_file: "/etc/nats/certs/server.key"
#   ca_file: "/etc/nats/certs/ca.crt"
#   verify: true
# }